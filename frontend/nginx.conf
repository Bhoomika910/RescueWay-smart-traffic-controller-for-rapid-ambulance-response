# Serves the Vite-built SPA with client-side routing fallback.
# The backend is reached directly by the browser via VITE_API_BASE_URL
# (baked into the JS at build time), not proxied through this nginx — see
# Dockerfile's ARG VITE_API_BASE_URL comment.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
