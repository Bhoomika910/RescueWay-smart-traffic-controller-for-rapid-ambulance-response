name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint, type-check, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: python -m ruff check .

      - name: Black (format check)
        run: python -m black --check .

      - name: Mypy (type-check — strict-mode modules only, see pyproject.toml)
        run: python -m mypy rl/safety_shield.py rl/emergency_scoring.py routers/auth.py models/schemas.py

      - name: Pytest (with coverage)
        # Includes the three top-level legacy validation scripts
        # (test_accuracy.py/test_reward.py/test_simulator.py) alongside
        # tests/ — real pytest-collectible tests with real assertions, kept
        # at top level for their dual role as standalone `python
        # test_X.py` scripts, not excluded from CI just because of where
        # they live.
        run: python -m pytest tests/ test_accuracy.py test_reward.py test_simulator.py -q --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=0
        env:
          PYTHONIOENCODING: utf-8

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker-build:
    name: Docker image build (smoke test)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t rescueway-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t rescueway-frontend:ci ./frontend
